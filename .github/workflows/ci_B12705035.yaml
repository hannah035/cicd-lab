name: CI Pipeline

# pipeline 需要在 push 時自動執行
on:
  push:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 可依據專案實際 Node 版本調整
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. TypeScript typecheck
      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      # 2. Prettier check
      - name: Prettier Check
        run: npx prettier --check .

      # 3. Test & Generate Report (改用 Vitest)
      - name: Run Tests
        if: always() 
        # 使用 vitest 執行測試，並同時在終端機(default)與檔案(junit)輸出結果
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/junit.xml

      # 4. 將測試結果顯示於 GitHub actions 結果頁面
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Vitest Test Results
          path: reports/junit.xml
          reporter: java-junit # Vitest 產出的 junit 格式，可以用 java-junit 解析器來讀取
