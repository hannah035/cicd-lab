name: CI Pipeline

# pipeline 需要在 push 時自動執行
on:
  push:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 可依據專案實際 Node 版本調整
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. TypeScript typecheck
      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      # 2. Prettier check
      - name: Prettier Check
        run: npx prettier --check .

      # 3. Test & Generate Report
      - name: Run Tests
        run: npx jest --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml

      # 4. 將測試結果顯示於 GitHub actions 結果頁面
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure() # 確保即使測試失敗，也會執行此步驟來顯示報表
        with:
          name: Jest Test Results
          path: reports/jest-junit.xml
          reporter: jest-junit
